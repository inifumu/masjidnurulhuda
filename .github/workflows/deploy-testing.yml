name: Deploy testing

on:
  push:
    branches:
      - testing
  workflow_dispatch:

concurrency:
  group: testing-deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run test
      - run: npm run build
      - run: npm run test:migrations

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment: testing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Apply testing D1 migrations
        run: npx wrangler d1 migrations apply masjidnurulhuda-testing-db --remote --config wrangler.testing.toml
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      - name: Prepare isolated testing deployment workspace
        run: |
          mkdir -p .wrangler/testing-deploy
          cp wrangler.testing.toml .wrangler/testing-deploy/wrangler.toml
          cp -R dist functions server shared .wrangler/testing-deploy/
      - name: Deploy testing Pages
        run: npx wrangler pages deploy dist --project-name masjidnurulhuda-testing --branch testing --commit-dirty=true --cwd .wrangler/testing-deploy
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
