name: Deploy revamp

on:
  push:
    branches:
      - revamp/full-product
  workflow_dispatch:

concurrency:
  group: revamp-deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run test
      - run: npm run build
      - run: npm run test:migrations

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment: revamp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Apply revamp D1 migrations
        run: npx wrangler d1 migrations apply masjidnurulhuda-revamp-db --remote --config wrangler.revamp.toml
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      - name: Prepare isolated revamp deployment workspace
        run: |
          mkdir -p .wrangler/revamp-deploy
          cp wrangler.revamp.toml .wrangler/revamp-deploy/wrangler.toml
          cp -R dist functions server shared .wrangler/revamp-deploy/
      - name: Deploy revamp Pages
        run: npx wrangler pages deploy dist --project-name masjidnurulhuda-revamp --branch revamp/full-product --commit-dirty=true --cwd .wrangler/revamp-deploy
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
